name: Build macOS app

on:
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  push:
    tags: ["v*"]            # e.g. git tag v1.0.0 && git push --tags -> also publishes a Release

permissions:
  contents: write

jobs:
  mac-arm64:
    runs-on: macos-15       # Apple Silicon (arm64) runner; macos-14 was retired Nov 2026
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build DMG + ZIP (arm64)
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Webmail-Launcher-mac-arm64
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
